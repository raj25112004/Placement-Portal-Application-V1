{% extends 'base.html' %}

{% block content %}

<div class="row">
    <div class="col-md-6 mx-auto">

        <div class="card p-4 border-0 shadow">

            <h3 class="text-center mb-4 fw-bold color-primary">Post a New Opening</h3>

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Job Title</label>
                    <input type="text" name="title" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="3" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Skills Required</label>
                    <input type="text" name="skills" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Salary Range</label>
                    <input type="text" name="salary" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Job Type</label>
                    <input type="text" name="job_type" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Location</label>
                    <input type="text" name="location" class="form-control">
                </div>

                <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm rounded-pill mt-3">Create Job</button>

            </form>

        </div>

    </div>
</div>

{% endblock %}
