{% extends 'base.html' %}

{% block content %}

<h3 class="mb-4">Company Dashboard</h3>

<div class="mb-4">
    <a href="/company/job/create" class="btn btn-success btn-lg px-4 shadow-sm rounded-pill">+ Post New Job</a>
</div>

<div class="card border-0 shadow-sm mb-4 overflow-hidden">

    <h5 class="card-header bg-white py-3 fw-bold">Your Job Listings</h5>

    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">

            <thead class="bg-light">
                <tr>
                    <th>Job Title</th>
                    <th>Status</th>
                    <th>Applications</th>
                </tr>
            </thead>

            <tbody>
                {% for job in jobs %}
                <tr>
                    <td>{{ job.title }}</td>

                    <td>
                        {% if job.is_approved %}
                            <span class="badge rounded-pill bg-success px-3">Approved</span>
                        {% else %}
                            <span class="badge rounded-pill bg-warning text-dark px-3">Pending</span>
                        {% endif %}
                    </td>

                    <td>
                        <a href="/company/job/applications/{{ job.id }}" class="btn btn-outline-primary btn-sm rounded-pill px-3">
                            Applications
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>

</div>

<div class="card p-4 border-0 shadow-sm text-center">
    <h5 class="mb-4 fw-bold">Recruitment Analytics</h5>

    <div style="max-width: 600px; margin: auto;">
        <canvas id="companyChart"></canvas>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const labels = JSON.parse('{{ titles | tojson }}');
    const data = JSON.parse('{{ counts | tojson }}');

    new Chart(document.getElementById('companyChart'), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                data: data,
                backgroundColor: '#a855f7',
                borderRadius: 8
            }]
        },
        options: {
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: { beginAtZero: true }
            }
        }
    });

});
</script>

{% endblock %}
