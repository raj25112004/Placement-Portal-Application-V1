{% extends 'base.html' %}

{% block content %}

<h3 class="mb-4">Company Dashboard</h3>

<div class="card p-3 shadow-sm mb-4">
    <a href="/company/job/create" class="btn btn-success">Post New Job</a>
</div>

<div class="card p-3 shadow-sm mb-4">

    <h5 class="mb-3">Your Job Listings</h5>

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">

            <thead class="table-dark">
                <tr>
                    <th>Job Title</th>
                    <th>Status</th>
                    <th>Applications</th>
                </tr>
            </thead>

            <tbody>
                {% for job in jobs %}
                <tr>
                    <td>{{ job.title }}</td>

                    <td>
                        {% if job.is_approved %}
                            <span class="badge bg-success">Approved</span>
                        {% else %}
                            <span class="badge bg-warning text-dark">Pending</span>
                        {% endif %}
                    </td>

                    <td>
                        <a href="/company/job/applications/{{ job.id }}" class="btn btn-primary btn-sm">
                            View Applications
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>

</div>

<div class="card p-4 shadow-sm text-center">
    <h5 class="mb-3">Applications per Job</h5>

    <div style="max-width: 600px; margin: auto;">
        <canvas id="companyChart"></canvas>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const labels = JSON.parse('{{ titles | tojson }}');
    const data = JSON.parse('{{ counts | tojson }}');

    new Chart(document.getElementById('companyChart'), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                data: data,
                backgroundColor: '#9b59b6',
                borderRadius: 8
            }]
        },
        options: {
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: { beginAtZero: true }
            }
        }
    });

});
</script>

{% endblock %}
