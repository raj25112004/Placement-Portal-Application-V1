<h2>Company Dashboard</h2>

<a href="/company/job/create">Post New Job</a><br><br>

<table border="1">
<tr>
    <th>Title</th>
    <th>Status</th>
    <th>Action</th>
</tr>

{% for job in jobs %}
<tr>
    <td>{{ job.title }}</td>
    <td>{{ job.is_approved }}</td>
    <td>
        <a href="/company/job/applications/{{ job.id }}">View Applications</a>
    </td>
</tr>
{% endfor %}
</table>
