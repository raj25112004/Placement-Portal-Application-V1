{% extends 'base.html' %}

{% block content %}

<div class="row">
    <div class="col-md-4 mx-auto mt-5">

        <div class="card p-5 border-0 shadow-lg" style="background: rgba(255, 255, 255, 0.85);">

            <div class="text-center mb-4">
                <div class="d-inline-block p-3 rounded-circle shadow-sm mb-3" style="background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);">
                    <i class="bi bi-shield-lock text-white fs-4"></i>
                </div>
                <h3 class="fw-bold">Member Login</h3>
                <p class="text-muted small">Please enter your credentials</p>
            </div>

            <form method="POST" onsubmit="return validateLogin()">

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required minlength="6">
                </div>

                <button type="submit" class="btn btn-success w-100 py-2 fw-bold rounded-pill shadow-sm mt-3">Login</button>

            </form>

            <div class="text-center mt-4">
                <p class="small text-muted mb-2">Don't have an account?</p>
                <a href="/register" class="btn btn-outline-primary btn-sm rounded-pill px-4">Register</a>
            </div>

        </div>

    </div>
</div>

<script>
function validateLogin() {
    var email = document.querySelector('input[name="email"]').value;
    var password = document.querySelector('input[name="password"]').value;

    if (!email.includes("@")) {
        alert("Invalid email");
        return false;
    }

    if (password.length < 6) {
        alert("Password must be at least 6 characters");
        return false;
    }

    return true;
}
</script>

{% endblock %}
