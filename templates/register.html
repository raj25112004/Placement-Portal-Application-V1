{% extends 'base.html' %}

{% block content %}

<div class="row">
    <div class="col-md-6 mx-auto">

        <div class="card p-4 shadow-sm">

            <h3 class="text-center mb-3">Register</h3>

            <form method="POST" enctype="multipart/form-data" onsubmit="return validateForm()">

                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required minlength="6">
                </div>

                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select name="role" class="form-select" required>
                        <option value="student">Student</option>
                        <option value="company">Company</option>
                    </select>
                </div>

                <hr>

                <h5 class="mb-2">Student Details</h5>

                <div class="mb-3">
                    <label class="form-label">Branch</label>
                    <input type="text" name="branch" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Year of Passing</label>
                    <input type="number" name="year" class="form-control" min="2000" max="2100">
                </div>

                <div class="mb-3">
                    <label class="form-label">CGPA</label>
                    <input type="number" name="cgpa" class="form-control" step="0.01" min="0" max="10">
                </div>

                <div class="mb-3">
                    <label class="form-label">Resume</label>
                    <input type="file" name="resume" class="form-control" accept=".pdf,.doc,.docx">
                </div>

                <hr>

                <h5 class="mb-2">Company Details</h5>

                <div class="mb-3">
                    <label class="form-label">Company Name</label>
                    <input type="text" name="company_name" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Industry</label>
                    <input type="text" name="industry" class="form-control">
                </div>

                <button type="submit" class="btn btn-success w-100">Register</button>

            </form>

            <div class="text-center mt-3">
                <p>Already have an account?</p>
                <a href="/login" class="btn btn-outline-primary">Login</a>
            </div>

        </div>

    </div>
</div>

<script>
function validateForm() {
    var email = document.querySelector('input[name="email"]').value;
    var password = document.querySelector('input[name="password"]').value;
    var cgpa = document.querySelector('input[name="cgpa"]').value;

    if (!email.includes("@")) {
        alert("Invalid email");
        return false;
    }

    if (password.length < 6) {
        alert("Password must be at least 6 characters");
        return false;
    }

    if (cgpa && (cgpa < 0 || cgpa > 10)) {
        alert("CGPA must be between 0 and 10");
        return false;
    }

    return true;
}
</script>

{% endblock %}
