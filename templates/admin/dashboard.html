{% extends 'base.html' %}

{% block content %}

<h3 class="mb-4">Admin Dashboard</h3>

<div class="row">

    <div class="col-md-3">
        <div class="card text-center shadow-sm p-3 mb-3">
            <h6>Total Students</h6>
            <h4>{{ students }}</h4>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-center shadow-sm p-3 mb-3">
            <h6>Total Companies</h6>
            <h4>{{ companies }}</h4>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-center shadow-sm p-3 mb-3">
            <h6>Total Jobs</h6>
            <h4>{{ jobs }}</h4>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-center shadow-sm p-3 mb-3">
            <h6>Total Applications</h6>
            <h4>{{ applications }}</h4>
        </div>
    </div>

</div>

<div class="card p-3 shadow-sm mb-4">
    <div class="d-flex gap-2 flex-wrap">
        <a href="/admin/companies" class="btn btn-primary">Manage Companies</a>
        <a href="/admin/jobs" class="btn btn-warning">Manage Jobs</a>
        <a href="/admin/students" class="btn btn-success">View Students</a>
    </div>
</div>

<div class="card p-4 shadow-sm text-center">
    <h5 class="mb-3">System Overview</h5>

    <div style="max-width: 600px; margin: auto;">
        <canvas id="adminChart"></canvas>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const data = JSON.parse('{{ [jobs, applications, placements] | tojson }}');

    new Chart(document.getElementById('adminChart'), {
        type: 'bar',
        data: {
            labels: ['Jobs', 'Applications', 'Placements'],
            datasets: [{
                data: data,
                backgroundColor: [
                    '#3498db',
                    '#f39c12',
                    '#2ecc71'
                ],
                borderRadius: 8
            }]
        },
        options: {
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

});
</script>

{% endblock %}
