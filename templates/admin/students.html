{% extends 'base.html' %}

{% block content %}

<h3 class="mb-3">Students</h3>

<div class="card p-3 shadow-sm">

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">

            <thead class="table-dark">
                <tr>
                    <th>Name</th>
                    <th>Branch</th>
                    <th>CGPA</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                {% for s in students %}
                <tr>
                    <td>{{ s.name }}</td>
                    <td>{{ s.branch }}</td>
                    <td>{{ s.cgpa }}</td>

                    <td>
                        <a href="/admin/student/deactivate/{{ s.user_id }}" class="btn btn-danger btn-sm">
                            Deactivate
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>

</div>

{% endblock %}
