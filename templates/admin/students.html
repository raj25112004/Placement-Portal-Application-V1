<h2>Students</h2>

<form action="/admin/search/student">
    <input type="text" name="q" placeholder="Search student">
    <button type="submit">Search</button>
</form>

<table border="1">
<tr>
    <th>Name</th>
    <th>Branch</th>
    <th>CGPA</th>
    <th>Action</th>
</tr>

{% for s in students %}
<tr>
    <td>{{ s.name }}</td>
    <td>{{ s.branch }}</td>
    <td>{{ s.cgpa }}</td>
    <td>
        <a href="/admin/student/deactivate/{{ s.user_id }}">Deactivate</a>
    </td>
</tr>
{% endfor %}
</table>
