{% extends 'base.html' %}

{% block content %}

<h2>Students</h2>

<table>
<tr>
    <th>Name</th>
    <th>Branch</th>
    <th>CGPA</th>
    <th>Action</th>
</tr>

{% for s in students %}
<tr>
    <td>{{ s.name }}</td>
    <td>{{ s.branch }}</td>
    <td>{{ s.cgpa }}</td>

    <td>
        <a href="/admin/student/deactivate/{{ s.user_id }}" class="button-link">
            Deactivate
        </a>
    </td>
</tr>
{% endfor %}
</table>

{% endblock %}
