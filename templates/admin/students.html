{% extends 'base.html' %}

{% block content %}

<h3 class="mb-3">Students</h3>

<div class="card border-0 shadow-sm overflow-hidden">

    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">

            <thead class="bg-light border-bottom">
                <tr>
                    <th>Name</th>
                    <th>Branch</th>
                    <th>CGPA</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                {% for s in students %}
                <tr>
                    <td>{{ s.name }}</td>
                    <td>{{ s.branch }}</td>
                    <td>{{ s.cgpa }}</td>

                    <td>
                        <a href="/admin/student/deactivate/{{ s.user_id }}" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                            <i class="bi bi-person-x me-1"></i> Deactivate
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>

</div>

{% endblock %}
