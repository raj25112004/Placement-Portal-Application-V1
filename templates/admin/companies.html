{% extends 'base.html' %}

{% block content %}

<h3 class="mb-3">Companies</h3>

<div class="card border-0 shadow-sm overflow-hidden">

    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">

            <thead class="bg-light border-bottom">
                <tr>
                    <th>Name</th>
                    <th>Industry</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                {% for c in companies %}
                <tr>
                    <td>{{ c.company_name }}</td>
                    <td>{{ c.industry }}</td>

                    <td>
                        {% if c.user.is_approved %}
                            <span class="badge rounded-pill bg-success px-3">Approved</span>
                        {% else %}
                            <span class="badge rounded-pill bg-warning text-dark px-3">Pending</span>
                        {% endif %}
                    </td>

                    <td>
                        <a href="/admin/company/approve/{{ c.user_id }}" class="btn btn-outline-success btn-sm rounded-pill">Approve</a>
                        <a href="/admin/company/reject/{{ c.user_id }}" class="btn btn-outline-danger btn-sm rounded-pill">Reject</a>
                        <a href="/admin/company/deactivate/{{ c.user_id }}" class="btn btn-outline-secondary btn-sm rounded-pill">Deactivate</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>

</div>

{% endblock %}
