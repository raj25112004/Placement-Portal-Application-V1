{% extends 'base.html' %}

{% block content %}

<h3 class="mb-3">Jobs</h3>

<div class="card p-3 shadow-sm">

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">

            <thead class="table-dark">
                <tr>
                    <th>Title</th>
                    <th>Company</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                {% for j in jobs %}
                <tr>
                    <td>{{ j.title }}</td>
                    <td>{{ j.company.company_name }}</td>

                    <td>
                        {% if j.is_approved %}
                            <span class="badge bg-success">Approved</span>
                        {% else %}
                            <span class="badge bg-warning text-dark">Pending</span>
                        {% endif %}
                    </td>

                    <td>
                        <a href="/admin/job/approve/{{ j.id }}" class="btn btn-success btn-sm">Approve</a>
                        <a href="/admin/job/reject/{{ j.id }}" class="btn btn-danger btn-sm">Reject</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>

</div>

{% endblock %}
