{% extends 'base.html' %}

{% block content %}

<h3 class="mb-3">Jobs</h3>

<div class="card border-0 shadow-sm overflow-hidden">

    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">

            <thead class="bg-light border-bottom">
                <tr>
                    <th>Title</th>
                    <th>Company</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                {% for j in jobs %}
                <tr>
                    <td>{{ j.title }}</td>
                    <td>{{ j.company.company_name }}</td>

                    <td>
                        {% if j.is_approved %}
                            <span class="badge rounded-pill bg-success px-3">Approved</span>
                        {% else %}
                            <span class="badge rounded-pill bg-warning text-dark px-3">Pending</span>
                        {% endif %}
                    </td>

                    <td>
                        <a href="/admin/job/approve/{{ j.id }}" class="btn btn-outline-success btn-sm rounded-pill px-3">Approve</a>
                        <a href="/admin/job/reject/{{ j.id }}" class="btn btn-outline-danger btn-sm rounded-pill px-3">Reject</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>

</div>

{% endblock %}
