{% extends 'base.html' %}

{% block content %}

<h3 class="mb-4">Student Dashboard</h3>

<div class="card border-0 shadow-sm mb-4 overflow-hidden">

    <h5 class="card-header bg-white py-3 fw-bold">Available Jobs</h5>

    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">

            <thead class="bg-light">
                <tr>
                    <th>Job Title</th>
                    <th>Company</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                {% for job in jobs %}
                <tr>
                    <td>{{ job.title }}</td>
                    <td>{{ job.company.company_name }}</td>

                    <td>
                        <a href="/student/apply/{{ job.id }}" class="btn btn-primary btn-sm rounded-pill px-3 shadow-sm">
                            <i class="bi bi-send me-1"></i> Apply
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>

</div>

<div class="text-center">
    <a href="/student/applications" class="btn btn-success btn-lg rounded-pill px-5 shadow-sm">
        <i class="bi bi-view-list me-2"></i> View My Applications
    </a>
</div>

{% endblock %}
